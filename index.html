<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🌱 AGROHERÓIS • Missão Sustentável</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-container">
        <!-- CABEÇALHO COM LOGO E ACESSIBILIDADE -->
        <header>
            <div class="logo-area">
                <h1>🌱 AGROHERÓIS <span class="sub">🚜</span></h1>
                <p>🌾 Agro Forte • Futuro Sustentável 🌻</p>
            </div>
            <div class="toolbox">
                <button id="darkModeBtn" title="Modo escuro">🌙</button>
                <button id="highContrastBtn" title="Alto contraste">🔆</button>
                <button id="fontPlusBtn" title="Aumentar fonte">A+</button>
                <button id="fontMinusBtn" title="Diminuir fonte">A-</button>
                <button id="resetGameBtn" title="Reiniciar jogo">🔄</button>
                <button id="mainMenuBtn" title="Menu principal">🏠</button>
            </div>
        </header>

        <!-- BARRA DE PROGRESSO -->
        <div class="progress-section">
            <span>📊 MISSÃO</span>
            <progress id="globalProgress" value="0" max="100"></progress>
            <span id="progressPercent">0%</span>
        </div>

        <!-- CONTEÚDO PRINCIPAL DINÂMICO -->
        <main id="gameMain">
            <!-- as fases serão injetadas aqui -->
        </main>

        <!-- RODAPÉ COM PONTUAÇÃO, CONQUISTAS E FELIPE -->
        <footer>
            <div class="stats">
                <div class="score">🏆 <span id="totalScore">0</span> pontos</div>
                <div class="achievements">🏅 Conquistas <span id="totalBadges">0</span>/3</div>
            </div>
            <div class="guide">
                <div class="avatar">👨‍🌾</div>
                <div class="speech" id="felipeSpeech">Olá! Eu sou Felipe, seu guia agroecológico! 🌱</div>
            </div>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>

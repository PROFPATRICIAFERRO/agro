<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🌱 AGROHERÓIS | Missão Sustentável</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrapper">
        <header class="hero">
            <div class="logo">
                <h1>🌱 AGROHERÓIS</h1>
                <p>Agro Forte, Futuro Sustentável</p>
            </div>
            <div class="toolbar">
                <button id="darkModeBtn" title="Modo Escuro">🌙</button>
                <button id="highContrastBtn" title="Alto Contraste">🔆</button>
                <button id="fontPlusBtn" title="Aumentar Fonte">A+</button>
                <button id="fontMinusBtn" title="Diminuir Fonte">A-</button>
                <button id="resetGameBtn" title="Reiniciar Jogo">🔄</button>
                <button id="menuBtn" title="Menu Principal">🏠</button>
            </div>
        </header>

        <div class="progress-wrapper">
            <span>📊 MISSÃO</span>
            <progress id="globalProgress" value="0" max="100"></progress>
            <span id="progressPercent">0%</span>
        </div>

        <main id="gameScreen">
            <!-- Conteúdo dinâmico -->
        </main>

        <footer class="dashboard">
            <div class="score-card">🏆 <span id="score">0</span> pts</div>
            <div class="badge-card">🏅 Conquistas <span id="badges">0</span>/3</div>
            <div class="felipe-speech">
                <div class="avatar">👨‍🌾</div>
                <div class="bubble" id="felipeMessage">Olá! Sou Felipe, seu guia agroecológico!</div>
            </div>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
